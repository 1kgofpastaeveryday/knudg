<h1>Knudgの開発は停止しました。</h1>

<p>Knudgは、<span lang="en">coding agent</span>向けのセルフホスト型作業ログでした。うまくいった修正、失敗した道、環境固有の落とし穴を残し、次の作業がそこから始められるようにするものです。</p>

<p>現在は開発していません。新しいリリース、修正、サポートの予定はありません。</p>

<p>ソースコードは<span lang="en">Apache-2.0</span>ライセンスで、現状のまま<a href="https://github.com/1kgofpastaeveryday/knudg"><span lang="en">GitHub</span></a>に公開しています。</p>
