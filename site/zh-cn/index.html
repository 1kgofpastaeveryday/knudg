<h1>Knudg 已停止开发。</h1>

<p>Knudg 曾是面向编码 <span lang="en">Agent</span> 的自托管工作日志：记录哪些修复有效、哪些路径失败、哪些环境陷阱浪费了尝试，让下一次运行从已学到的结果开始。</p>

<p>目前已不再开发，也没有新版本、修复或支持的计划。</p>

<p>源代码以 <span lang="en">Apache-2.0</span> 许可证按现状公开在 <a href="https://github.com/1kgofpastaeveryday/knudg"><span lang="en">GitHub</span></a> 上。</p>
